name: Tauri Windows build

# Builds the experimental Tauri shell's Windows NSIS installer and uploads it
# as a workflow artifact. Release builds are covered by the Release workflow
# (the Tauri leg rides its Windows matrix entry); this one exists for building
# on demand or iterating on the shell without a version bump.

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - 'packages/tauri/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/build-tauri-windows.yml'

permissions:
  contents: read

concurrency:
  group: tauri-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-nsis:
    name: Build Windows NSIS bundle
    runs-on: windows-latest
    timeout-minutes: 45

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: pnpm

      - name: Setup Rust
        uses: dtolnay/rust-toolchain@stable

      # The release compile of the whole dependency tree is what makes the
      # first run slow; afterwards only boardown-tauri itself recompiles.
      - name: Cache Cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\AppData\Local\cargo\registry
            ~\AppData\Local\cargo\git
            packages\tauri\src-tauri\target
          key: tauri-windows-${{ runner.os }}-${{ hashFiles('packages/tauri/src-tauri/Cargo.lock') }}
          restore-keys: tauri-windows-${{ runner.os }}-

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build Tauri NSIS bundle
        run: pnpm --filter @boardown/tauri dist

      - name: Upload installer
        uses: actions/upload-artifact@v4
        with:
          name: boardown-tauri-windows
          if-no-files-found: error
          path: packages/tauri/src-tauri/target/release/bundle/nsis/*.exe
