[package]
name = "boardown-tauri"
version = "0.9.0"
description = "boardown desktop app — a local-first Markdown task board."
license = "MIT"
edition = "2021"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
notify = "8"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
tauri = { version = "2", features = [] }
tauri-plugin-dialog = "2"

[profile.release]
strip = true
